[package]
name = "system-monitor-x"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
description = "A native Windows task manager built with Rust and GPUI Kit"
license = "Apache-2.0"
repository = "https://github.com/neko233-com/SystemMonitorX"
default-run = "SystemMonitorX"

[features]
ui-test = ["gpui-kit/test-support"]

[[bin]]
name = "SystemMonitorX"
path = "src/main.rs"

[[bin]]
name = "SystemMonitorXUpdate"
path = "src/bin/update_helper.rs"

[dependencies]
anyhow = "1"
gpui-kit = "=0.7.1"
sysinfo = "=0.39.6"
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
wmi = "=0.18.4"
ntapi = "=0.4.3"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12",
  "Win32_System_Performance", "Win32_System_Threading", "Win32_System_ProcessStatus",
  "Win32_System_Registry", "Win32_System_Services", "Win32_Security",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation",
  "Win32_System_Environment", "Win32_System_Com",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl",
  "Win32_Networking_WinHttp", "Win32_System_LibraryLoader",
  "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock",
  "Win32_System_RemoteDesktop", "Win32_Security_Authorization",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Time", "Win32_System_Power",
    "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
