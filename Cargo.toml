[package]
name = "system-monitor-x"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A native Windows task manager built with Rust and GPUI Kit"
license = "Apache-2.0"
repository = "https://github.com/neko233-com/SystemMonitorX"
default-run = "SystemMonitorX"

[features]
ui-test = ["gpui-kit/test-support"]

[[bin]]
name = "SystemMonitorX"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gpui-kit = "=0.7.1"
sysinfo = "=0.39.6"
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_System_Performance", "Win32_System_Threading", "Win32_System_ProcessStatus",
  "Win32_System_Registry", "Win32_System_Services", "Win32_Security",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation",
  "Win32_System_Environment", "Win32_System_Com",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
